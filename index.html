<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#f7f6f3">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="单词闯关">
<title>单词闯关 · 我的词汇本</title>
<style>
:root{
  --bg:#f7f6f3; --card:#ffffff; --text:#1c1c1c; --text2:#6a6a6a; --text3:#a09c93;
  --line:#e6e3dc; --gold:#bd8b2b; --gold-dim:#97701f;
  --ok:#2f8f5b; --ok-bg:#eaf5ee; --bad:#c2453c; --bad-bg:#fbeceb;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05);
  --r:16px;
}
html.dark{
  --bg:#111110; --card:#1b1b1a; --text:#f0eee9; --text2:#a3a09a; --text3:#6f6c66;
  --line:#2c2c2a; --gold:#d9a94e; --gold-dim:#c2953f;
  --ok:#5cc98a; --ok-bg:#16281d; --bad:#ef8079; --bad-bg:#2a1917;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:16px; line-height:1.5;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(env(safe-area-inset-bottom) + 84px) env(safe-area-inset-left);
  transition:background .2s,color .2s;
  overscroll-behavior-y:contain;
}
.wrap{max-width:560px;margin:0 auto;padding:18px 18px 0}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 0 14px}
.brand{font-weight:700;letter-spacing:.5px}
.brand small{display:block;font-weight:400;font-size:11px;color:var(--text3);letter-spacing:1.5px}
.iconbtn{border:none;background:var(--card);color:var(--text2);width:38px;height:38px;border-radius:12px;font-size:16px;box-shadow:var(--shadow);cursor:pointer}
h2{font-size:13px;margin:0 0 10px;color:var(--text3);font-weight:600;letter-spacing:1.2px;text-transform:uppercase}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.hero{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}
.stat{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 10px;text-align:center}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.stat span{font-size:11px;color:var(--text3);letter-spacing:.5px}
.modes{display:grid;gap:10px;margin-bottom:22px}
.mode{display:flex;align-items:center;gap:14px;background:var(--card);border:none;border-radius:var(--r);
  padding:16px;text-align:left;box-shadow:var(--shadow);cursor:pointer;color:var(--text);width:100%;font-size:15px;
  transition:transform .12s ease}
.mode:active{transform:scale(.985)}
.mode .em{font-size:22px;width:34px;text-align:center;flex:none}
.mode b{display:block;font-size:15px;font-weight:600}
.mode i{display:block;font-style:normal;font-size:12px;color:var(--text3);margin-top:2px}
.mode .arrow{margin-left:auto;color:var(--text3);font-size:18px}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-dim));width:0;transition:width .3s}
.quiztop{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.quiztop .bar{flex:1}
.counter{font-size:12px;color:var(--text3);font-variant-numeric:tabular-nums}
.qcard{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:26px 20px;text-align:center;margin-bottom:16px;min-height:150px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.qlabel{font-size:11px;letter-spacing:2px;color:var(--gold);text-transform:uppercase;font-weight:600}
.qtext{font-size:27px;font-weight:650;line-height:1.35;word-break:break-word}
.qtext.en{font-family:Georgia,"Times New Roman",serif;font-weight:600}
.qtext.sent{font-family:Georgia,"Times New Roman",serif;font-size:19px;font-weight:500;text-align:left;line-height:1.65}
.blank{display:inline-block;min-width:64px;border-bottom:2px solid var(--gold);margin:0 3px;color:transparent;user-select:none}
.filled{color:var(--ok);font-weight:700;border-bottom:2px solid var(--ok)}
.qhint{font-size:13px;color:var(--text3);font-family:ui-monospace,Menlo,monospace;letter-spacing:1px}
.qzh{font-size:13.5px;color:var(--text2);text-align:left;border-top:1px dashed var(--line);padding-top:10px;margin-top:4px}
.opts{display:grid;gap:10px}
.opt{position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:15px 44px 15px 16px;
  font-size:16px;text-align:left;color:var(--text);cursor:pointer;transition:all .15s;width:100%;font-family:inherit;
  box-shadow:0 1px 2px rgba(0,0,0,.03)}
.opt .k{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--text3);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.opt:active{transform:scale(.99)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);font-weight:600}
.opt.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.opt:disabled{cursor:default;opacity:.95}
.opt.dim{opacity:.45}
.feedback{margin-top:14px;border-radius:14px;padding:14px 16px;font-size:14px;display:none}
.feedback.show{display:block;animation:pop .2s ease}
.feedback.good{background:var(--ok-bg);color:var(--ok)}
.feedback.wrong{background:var(--bad-bg);color:var(--bad)}
.feedback b{display:block;font-size:17px;margin-bottom:2px}
.feedback .fsent{font-family:Georgia,serif;color:var(--text);font-size:14.5px;margin-top:6px;line-height:1.6}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.row{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;border:none;border-radius:14px;padding:15px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;
  background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.btn.primary{background:var(--gold);color:#fff;box-shadow:0 6px 18px rgba(189,139,43,.28)}
.btn.ghost{background:transparent;box-shadow:none;color:var(--text2);border:1.5px solid var(--line)}
.btn:active{transform:scale(.99)}
input.type{width:100%;border:1.5px solid var(--line);background:var(--card);color:var(--text);border-radius:14px;padding:16px;
  font-size:19px;font-family:Georgia,serif;text-align:center;letter-spacing:.5px;outline:none;transition:border-color .15s}
input.type:focus{border-color:var(--gold)}
input.type.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
input.type.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.speak{border:none;background:transparent;color:var(--gold);font-size:20px;cursor:pointer;padding:4px 8px}
.mini{font-size:12px;color:var(--text3);text-align:center;margin-top:10px}
.search{width:100%;border:none;background:var(--card);border-radius:14px;padding:14px 16px;font-size:15px;color:var(--text);
  box-shadow:var(--shadow);outline:none;margin-bottom:14px;font-family:inherit}
.wrow{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line)}
.wrow:last-child{border-bottom:none}
.wrow .cn{font-size:14px;color:var(--text2);flex:1;min-width:0}
.wrow .en{font-family:Georgia,serif;font-size:16px;font-weight:600;text-align:right;word-break:break-word}
.dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--line)}
.dot.b1{background:#e0b86a}.dot.b2{background:#a8c48a}.dot.b3{background:var(--ok)}
.dot.bad{background:var(--bad)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;pointer-events:none;padding-bottom:env(safe-area-inset-bottom)}
.navbox{pointer-events:auto;display:flex;gap:4px;background:var(--card);border-radius:20px;box-shadow:0 8px 30px rgba(0,0,0,.13);
  padding:7px;margin-bottom:12px;border:1px solid var(--line)}
.navbox button{border:none;background:transparent;color:var(--text3);font-size:11px;padding:8px 14px;border-radius:14px;cursor:pointer;font-family:inherit;line-height:1.2}
.navbox button.on{background:var(--bg);color:var(--gold-dim);font-weight:600}
.navbox button span{display:block;font-size:17px;margin-bottom:1px}
.hidden{display:none!important}
.center{text-align:center}
.big{font-size:44px;margin:4px 0}
.sub{color:var(--text2);font-size:14px}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--bg);color:var(--text3);border:1px solid var(--line);margin-left:6px;vertical-align:middle}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">单词闯关<small id="hdrsub">AN EN · 词汇本</small></div>
    <button class="iconbtn" id="btnTheme" title="切换主题">◐</button>
  </header>

  <section id="vHome">
    <div class="hero">
      <div class="stat"><b id="sTotal">0</b><span>总词数</span></div>
      <div class="stat"><b id="sMastered">0</b><span>已掌握</span></div>
      <div class="stat"><b id="sWrong">0</b><span>错题待复习</span></div>
    </div>

    <h2>单词</h2>
    <div class="modes">
      <button class="mode" data-start="mix"><span class="em">🎯</span><span><b>混合闯关</b><i>中译英 + 英译中 + 拼写，20 题一轮</i></span><span class="arrow">›</span></button>
      <button class="mode" data-start="cn2en"><span class="em">🇨🇳</span><span><b>中译英 · 选择题</b><i>看中文，选英文</i></span><span class="arrow">›</span></button>
      <button class="mode" data-start="en2cn"><span class="em">🇬🇧</span><span><b>英译中 · 选择题</b><i>看英文，选含义</i></span><span class="arrow">›</span></button>
      <button class="mode" data-start="spell"><span class="em">⌨️</span><span><b>拼写挑战</b><i>看中文，把英文敲出来</i></span><span class="arrow">›</span></button>
    </div>

    <h2>句子挖空 <span class="pill" id="clozeCount">478 句</span></h2>
    <div class="modes">
      <button class="mode" data-start="cloze"><span class="em">🧩</span><span><b>挖空 · 填空</b><i>看句子和中文，把缺的词写出来</i></span><span class="arrow">›</span></button>
      <button class="mode" data-start="clozeC"><span class="em">📝</span><span><b>挖空 · 选择</b><i>四选一，语感更快</i></span><span class="arrow">›</span></button>
    </div>

    <h2>复习</h2>
    <div class="modes">
      <button class="mode" data-start="wrong"><span class="em">🔁</span><span><b>错题重练</b><i id="wrongSub">复习做错过的单词和句子</i></span><span class="arrow">›</span></button>
    </div>

    <h2>今日</h2>
    <div class="card" style="margin-bottom:20px">
      <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--text2);margin-bottom:8px">
        <span>今天已做 <b id="todayDone">0</b> 题</span><span>正确率 <b id="todayAcc">—</b></span>
      </div>
      <div class="bar"><i id="todayBar"></i></div>
      <div class="mini" style="text-align:left;margin-top:10px">目标 30 题 / 天</div>
    </div>
  </section>

  <section id="vQuiz" class="hidden">
    <div class="quiztop">
      <button class="iconbtn" id="btnQuit" title="结束">✕</button>
      <div class="bar"><i id="qBar"></i></div>
      <div class="counter" id="qCount">1/20</div>
    </div>
    <div class="qcard">
      <div class="qlabel" id="qLabel">中译英</div>
      <div class="qtext" id="qText">—</div>
      <div class="qhint" id="qHint"></div>
      <div class="qzh hidden" id="qZh"></div>
      <div id="qSpeakWrap"></div>
    </div>
    <div class="opts" id="qOpts"></div>
    <div id="qTyping" class="hidden">
      <input class="type" id="qInput" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="输入英文…">
      <div class="row">
        <button class="btn ghost" id="btnHint">提示</button>
        <button class="btn primary" id="btnSubmit">提交</button>
      </div>
    </div>
    <div class="feedback" id="qFb"></div>
    <div class="row hidden" id="qNextRow"><button class="btn primary" id="btnNext">下一题</button></div>
    <div class="row"><button class="btn ghost" id="btnSkip">跳过</button></div>
  </section>

  <section id="vDone" class="hidden center">
    <div class="card" style="margin-top:30px">
      <div class="big" id="doneEmoji">🎉</div>
      <h2 style="font-size:20px;color:var(--text);margin-bottom:6px;text-transform:none;letter-spacing:0" id="doneTitle">这一轮完成</h2>
      <p class="sub" id="doneText">—</p>
      <div class="hero" style="margin:18px 0 4px">
        <div class="stat" style="box-shadow:none;background:var(--bg)"><b id="dOk">0</b><span>答对</span></div>
        <div class="stat" style="box-shadow:none;background:var(--bg)"><b id="dBad">0</b><span>答错</span></div>
        <div class="stat" style="box-shadow:none;background:var(--bg)"><b id="dAcc">0%</b><span>正确率</span></div>
      </div>
      <div id="dWrongList" style="text-align:left;margin-top:14px"></div>
      <div class="row" style="margin-top:18px">
        <button class="btn ghost" id="btnHome">回到首页</button>
        <button class="btn primary" id="btnAgain">再来一轮</button>
      </div>
    </div>
  </section>

  <section id="vList" class="hidden">
    <input class="search" id="searchBox" placeholder="搜索中文或英文…">
    <div id="wordList"></div>
  </section>
</div>

<nav><div class="navbox">
  <button data-nav="home" class="on"><span>🏠</span>练习</button>
  <button data-nav="list"><span>📖</span>词表</button>
</div></nav>

以取得医生资格。","a":"qualify","cn":"有资格去做"},{"id":467,"s":"Do not ______ the speed limit while driving.","zh":"开车时不要超过限速。","a":"exceed","cn":"超过"},{"id":468,"s":"The novel is praised for its honest ______.","zh":"这部小说因其诚实的现实主义而受到赞誉。","a":"realism","cn":"现实主义"},{"id":469,"s":"She put the pot on the ______ to cook soup.","zh":"她把锅放在炉子上煮汤。","a":"stove","cn":"炉子"},{"id":470,"s":"Gas began to ______ from the broken pipe.","zh":"气体开始从破裂的管道中泄漏。","a":"leak","cn":"泄漏"},{"id":471,"s":"It took the company two years to ______ the safety regulations across all its branches.","zh":"这家公司花了两年时间才在所有分支机构出台这些安全规定。","a":"implement","cn":"出台"},{"id":472,"s":"Many films tend to ______ country life.","zh":"许多电影倾向于把乡村生活浪漫化。","a":"romanticize","cn":"浪漫化"},{"id":473,"s":"Players argued with the ______ about the decision.","zh":"球员们就判罚与裁判争论。","a":"referee","cn":"裁判"},{"id":474,"s":"This is the latest ______ of the software.","zh":"这是该软件的最新版本。","a":"version","cn":"版本"},{"id":475,"s":"Water collected in the ______ after the heavy rain.","zh":"大雨过后，水积聚在盆地里。","a":"basin","cn":"盆地"},{"id":476,"s":"It took me a while to ______ the main idea.","zh":"我花了一会儿才领悟大意。","a":"grasp","cn":"把握，抓紧"},{"id":477,"s":"His argument was clear and ______.","zh":"他的论点清晰而有说服力。","a":"persuasive","cn":"有说服力的"}];
const ROUND = 20, ROUND_CLOZE = 10;
const LS_SRS = 'vocab_srs_v1', LS_DAY = 'vocab_day_v1';

/* ---------- storage ---------- */
function loadSrs(){ try{ return JSON.parse(localStorage.getItem(LS_SRS)) || {} }catch(e){ return {} } }
function saveSrs(o){ try{ localStorage.setItem(LS_SRS, JSON.stringify(o)) }catch(e){} }
function loadDay(){
  const t = new Date().toDateString();
  let d; try{ d = JSON.parse(localStorage.getItem(LS_DAY)) }catch(e){}
  if(!d || d.d !== t) d = {d:t, n:0, ok:0};
  return d;
}
function saveDay(d){ try{ localStorage.setItem(LS_DAY, JSON.stringify(d)) }catch(e){} }

let srs = loadSrs();
let day = loadDay();

const keyOf = it => it.kind === 'cloze' ? 'c' + it.id : String(it.id);
const box = it => { const r = srs[keyOf(it)]; if(!r) return 0; return r.box|0; };
const isWrong = it => { const r = srs[keyOf(it)]; return !!r && r.box < 0; };

function record(it, ok){
  const k = keyOf(it);
  const r = srs[k] || {box:0, ok:0, bad:0, last:0};
  r.last = Date.now();
  if(ok){ r.ok++; r.box = Math.min(3, (r.box < 0 ? 0 : r.box) + 1); }
  else { r.bad++; r.box = -1; }
  srs[k] = r;
  saveSrs(srs);
  day.n++; if(ok) day.ok++;
  saveDay(day);
}

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const norm = s => String(s).toLowerCase().replace(/[’']/g,"'").replace(/[.,;:!?！，。；：]/g,'').replace(/\s+/g,' ').trim();
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a }
function pick(arr,n){ return shuffle(arr.slice()).slice(0,n) }
function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function refreshHome(){
  const mastered = WORDS.filter(w=>box({kind:'word',id:w.id})>=3).length;
  const wrongW = WORDS.filter(w=>isWrong({kind:'word',id:w.id})).length;
  const wrongC = CLOZE.filter(c=>isWrong({kind:'cloze',id:c.id})).length;
  $('#sTotal').textContent = WORDS.length;
  $('#sMastered').textContent = mastered;
  $('#sWrong').textContent = wrongW + wrongC;
  const wrong = wrongW + wrongC;
  $('#wrongSub').textContent = wrong ? `复习 ${wrong} 道做错过的题` : '暂时没有错题，太强了';
  $('#clozeCount').textContent = CLOZE.length + ' 句';
  $('#todayDone').textContent = day.n;
  $('#todayAcc').textContent = day.n ? Math.round(day.ok/day.n*100) + '%' : '—';
  $('#todayBar').style.width = Math.min(100, Math.floor(day.n / 30 * 100)) + '%';
}

/* ---------- 出题 ---------- */
const wordItems = () => WORDS.map(w=>({kind:'word', id:w.id, cn:w.cn, en:w.en, pos:w.pos}));
const clozeItems = () => CLOZE.map(c=>({kind:'cloze', id:c.id, s:c.s, zh:c.zh, a:c.a, cn:c.cn}));

function weight(it){
  const r = srs[keyOf(it)];
  let s = Math.random();
  if(!r) s += 1.2;
  else if(r.box < 0) s += 1.6;
  else s += (3 - Math.min(3, r.box)) * 0.6;
  return s;
}
function takeTop(pool, n){
  return pool.map(it=>[weight(it), it]).sort((a,b)=>b[0]-a[0]).slice(0, n).map(x=>x[1]);
}

function buildRound(mode){
  if(mode === 'wrong'){
    const pool = [...wordItems(), ...clozeItems()].filter(isWrong);
    if(!pool.length) return null;
    return shuffle(pool).slice(0, 30);
  }
  if(mode === 'cloze' || mode === 'clozeC'){
    return takeTop(clozeItems(), ROUND_CLOZE);
  }
  return takeTop(wordItems(), ROUND);
}

/* ---------- quiz ---------- */
let Q = null;

function startQuiz(mode){
  const list = buildRound(mode);
  if(!list){ alert('还没有错题，先去练几轮吧～'); return }
  Q = {list, i:0, mode, ok:0, bad:0, wrongs:[]};
  show('quiz');
  renderQ();
}

function questionType(mode, it){
  if(it.kind === 'cloze') return Math.random() < 0.5 ? 'cloze' : 'clozeC';
  if(mode === 'mix' || mode === 'wrong') return ['cn2en','en2cn','spell'][Math.floor(Math.random()*3)];
  return mode;
}

function renderQ(){
  const it = Q.list[Q.i];
  const type = questionType(Q.mode, it);
  Q.cur = {type, it};
  $('#qBar').style.width = (Q.i / Q.list.length * 100) + '%';
  $('#qCount').textContent = `${Q.i+1}/${Q.list.length}`;
  $('#qFb').className = 'feedback';
  $('#qFb').innerHTML = '';
  $('#qNextRow').classList.add('hidden');
  $('#qSpeakWrap').innerHTML = '';
  $('#qZh').classList.add('hidden');
  $('#qZh').textContent = '';
  $('#qInput').value = '';
  $('#qInput').className = 'type';
  $('#qInput').disabled = false;
  $('#btnSkip').classList.remove('hidden');
  const opts = $('#qOpts');
  opts.innerHTML = '';
  opts.classList.add('hidden');
  $('#qTyping').classList.add('hidden');
  $('#qText').className = 'qtext';

  if(type === 'cn2en'){
    $('#qLabel').textContent = '选择英文' + (it.pos ? ' · ' + it.pos : '');
    $('#qText').textContent = it.cn;
    $('#qHint').textContent = '';
    opts.classList.remove('hidden');
    buildOptions(it, it.en, x=>x.en);
    return;
  }
  if(type === 'en2cn'){
    $('#qLabel').textContent = '选择含义';
    $('#qText').textContent = it.en;
    $('#qText').className = 'qtext en';
    $('#qHint').textContent = '';
    opts.classList.remove('hidden');
    buildOptions(it, it.cn, x=>x.cn);
    speakBtn(it.en);
    return;
  }
  if(type === 'spell'){
    $('#qLabel').textContent = '拼写' + (it.pos ? ' · ' + it.pos : '');
    $('#qText').textContent = it.cn;
    $('#qHint').textContent = '';
    return startTyping();
  }
  if(type === 'cloze' || type === 'clozeC'){
    $('#qLabel').textContent = type === 'cloze' ? '句子挖空 · 填空' : '句子挖空 · 选择';
    $('#qText').className = 'qtext sent';
    $('#qText').innerHTML = escapeHtml(it.s).replace(/_{3,}/, type === 'cloze'
      ? '<span class="blank">blank</span>'
      : '<span class="blank">blank</span>');
    $('#qZh').classList.remove('hidden');
    $('#qZh').textContent = it.zh ? '【中文】' + it.zh : `【词义】${it.cn || ''}`;
    $('#qHint').textContent = '';
    if(type === 'clozeC'){
      opts.classList.remove('hidden');
      buildOptions(it, it.a, x=>x.a, 'cloze');
    } else {
      startTyping();
    }
    return;
  }
}

function startTyping(){
  $('#qTyping').classList.remove('hidden');
  $('#qText').classList.remove('hidden');
  setTimeout(()=>{ try{ $('#qInput').focus() }catch(e){} }, 120);
}

function speakBtn(text){
  $('#qSpeakWrap').innerHTML = `<button class="speak" id="btnSpeak">🔊</button>`;
  $('#btnSpeak').onclick = ()=>speak(text);
}
function speak(text){
  try{
    if(!window.speechSynthesis) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = .9;
    speechSynthesis.speak(u);
  }catch(e){}
}

function buildOptions(it, correct, get, kind){
  const opts = $('#qOpts');
  const pool = (kind === 'cloze' ? clozeItems() : wordItems()).filter(x => keyOf(x) !== keyOf(it));
  const sorted = pool.sort((a,b)=>Math.abs(get(a).length-correct.length)-Math.abs(get(b).length-correct.length));
  const near = sorted.slice(0, 80);
  const distract = [];
  const used = new Set([correct]);
  for(const x of pick(near, 40)){
    const v = get(x);
    if(!v || used.has(v)) continue;
    used.add(v); distract.push(v);
    if(distract.length === 3) break;
  }
  const all = shuffle([correct, ...distract]);
  all.forEach((v, idx)=>{
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = `<span>${escapeHtml(v)}</span><span class="k">${idx+1}</span>`;
    b.onclick = ()=>answerChoice(b, v, correct, it);
    opts.appendChild(b);
  });
}

/* 宽松匹配：允许大小写、标点、以及词形变化（时态/单复数） */
function matchTyped(input, answer){
  const v = norm(input), a = norm(answer);
  if(!v) return false;
  if(v === a) return true;
  const strip = s => s.replace(/^the\s+/, '');
  if(strip(v) === strip(a)) return true;
  const forms = s => {
    const out = new Set([s, s+'s', s+'es', s+'ed', s+'d', s+'ing', s+'ly']);
    if(/e$/.test(s)) out.add(s.slice(0,-1)+'ing');
    if(/y$/.test(s)){ out.add(s.slice(0,-1)+'ies'); out.add(s.slice(0,-1)+'ied'); }
    if(/[^aeiou]y$/.test(s)) out.add(s.slice(0,-1)+'ier');
    return out;
  };
  if(forms(a).has(v)) return true;
  // 多词短语：只比较最后一个词
  if(a.includes(' ') && v.includes(' ')){
    const aa = a.split(' '), vv = v.split(' ');
    if(aa.length === vv.length && aa.slice(0,-1).join(' ') === vv.slice(0,-1).join(' ')){
      return forms(aa[aa.length-1]).has(vv[vv.length-1]);
    }
  }
  return false;
}

function answerChoice(el, v, correct, it){
  const opts = [...$('#qOpts').children];
  if(opts.some(o=>o.disabled)) return;
  const ok = norm(v) === norm(correct);
  opts.forEach(o=>{
    o.disabled = true;
    const t = o.querySelector('span').textContent;
    if(norm(t) === norm(correct)) o.classList.add('ok');
    else if(o === el) o.classList.add('bad');
    else o.classList.add('dim');
  });
  afterAnswer(ok, it);
}

function fillSentence(s, ans){
  return escapeHtml(s).replace(/_{3,}/, `<span class="filled">${escapeHtml(ans)}</span>`);
}

function afterAnswer(ok, it){
  record(it, ok);
  if(ok) Q.ok++; else { Q.bad++; Q.wrongs.push(it); }
  const fb = $('#qFb');
  fb.className = 'feedback show ' + (ok ? 'good' : 'wrong');

  if(it.kind === 'cloze'){
    fb.innerHTML = (ok ? '<b>✓ 正确</b>' : '<b>✕ 再记一次</b>')
      + `<div class="fsent">${fillSentence(it.s, it.a)}</div>`
      + `<div class="fsent" style="color:var(--text2);font-family:inherit;font-size:13px">${escapeHtml(it.a)} — ${escapeHtml(it.cn||'')}</div>`;
    if(!ok) speak(it.a);
  } else {
    fb.innerHTML = ok
      ? `<b>✓ 正确</b>${escapeHtml(it.cn)} — ${escapeHtml(it.en)}`
      : `<b>✕ 再记一次</b>${escapeHtml(it.cn)} — <b>${escapeHtml(it.en)}</b>`;
    if(!ok) speak(it.en);
  }
  $('#qNextRow').classList.remove('hidden');
  $('#btnSkip').classList.add('hidden');
}

function nextQ(){
  Q.i++;
  if(Q.i >= Q.list.length) finish(); else renderQ();
}

function finish(){
  const total = Q.ok + Q.bad;
  $('#dOk').textContent = Q.ok;
  $('#dBad').textContent = Q.bad;
  $('#dAcc').textContent = total ? Math.round(Q.ok/total*100)+'%' : '0%';
  $('#doneEmoji').textContent = Q.bad === 0 ? '🏆' : (Q.ok >= Q.bad ? '💪' : '📚');
  $('#doneTitle').textContent = Q.bad === 0 ? '全对，稳！' : '这一轮完成';
  $('#doneText').textContent = Q.bad === 0
    ? `这 ${total} 题你已经很熟了，继续保持。`
    : `做错 ${Q.bad} 道，已经收进错题本，晚点再过一遍。`;
  $('#dWrongList').innerHTML = Q.wrongs.length
    ? '<h2 style="margin-top:6px">本轮错题</h2>' + Q.wrongs.map(it=> it.kind === 'cloze'
        ? `<div class="wrow"><span class="cn" style="font-size:12.5px">${escapeHtml(it.s.replace(/_{3,}/,'__'))}</span><span class="en">${escapeHtml(it.a)}</span></div>`
        : `<div class="wrow"><span class="cn">${escapeHtml(it.cn)}</span><span class="en">${escapeHtml(it.en)}</span></div>`).join('')
    : '';
  refreshHome();
  show('done');
}

/* ---------- events ---------- */
$('#btnSubmit').onclick = ()=>{
  const {it, type} = Q.cur;
  const val = $('#qInput').value;
  if(!val.trim()) return;
  const answer = type === 'spell' ? it.en : it.a;
  const ok = type === 'spell' ? (norm(val) === norm(it.en)) : matchTyped(val, it.a);
  $('#qInput').disabled = true;
  $('#qInput').className = 'type ' + (ok ? 'ok' : 'bad');
  afterAnswer(ok, it);
};
$('#qInput').addEventListener('keydown', e=>{ if(e.key === 'Enter'){ e.preventDefault(); $('#btnSubmit').click() } });
$('#btnHint').onclick = ()=>{
  const {it, type} = Q.cur;
  if(type === 'spell'){
    const en = it.en;
    const shown = en.split(' ').map((part,i)=> i===0 ? part.slice(0, Math.max(2, Math.ceil(part.length/3))) + '…' : '…').join(' ');
    $('#qHint').textContent = shown + `（${en.replace(/[^A-Za-z]/g,'').length} 个字母）`;
  } else {
    const a = it.a;
    $('#qHint').textContent = a.split(' ').map(w=> w[0] + '·'.repeat(Math.max(1, w.length-1))).join(' ')
      + `（${a.replace(/[^A-Za-z]/g,'').length} 个字母）`;
  }
};
$('#btnNext').onclick = nextQ;
$('#btnSkip').onclick = ()=>{
  const it = Q.cur.it;
  record(it, false);
  Q.bad++; Q.wrongs.push(it);
  nextQ();
};
$('#btnQuit').onclick = ()=>{ if(confirm('结束这一轮？')) finish(); };
$('#btnHome').onclick = ()=>show('home');
$('#btnAgain').onclick = ()=>startQuiz(Q.mode);
document.querySelectorAll('[data-start]').forEach(b=>b.onclick = ()=>startQuiz(b.dataset.start));

function setTheme(dark){
  document.documentElement.classList.toggle('dark', dark);
  document.querySelector('meta[name=theme-color]').setAttribute('content', dark ? '#111110' : '#f7f6f3');
  try{ localStorage.setItem('vocab_theme', dark ? 'dark':'light') }catch(e){}
}
$('#btnTheme').onclick = ()=>setTheme(!document.documentElement.classList.contains('dark'));
(function(){
  let pref=null; try{ pref = localStorage.getItem('vocab_theme') }catch(e){}
  if(pref) setTheme(pref==='dark');
  else setTheme(!!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches));
})();

document.querySelectorAll('[data-nav]').forEach(b=>b.onclick = ()=>{
  document.querySelectorAll('[data-nav]').forEach(x=>x.classList.toggle('on', x===b));
  if(b.dataset.nav === 'list'){ show('list'); renderList(); } else show('home');
});

function show(v){
  ['home','quiz','done','list'].forEach(k=>$('#v'+k[0].toUpperCase()+k.slice(1)).classList.toggle('hidden', k!==v));
  window.scrollTo({top:0});
  if(v==='home') refreshHome();
}

/* ---------- list ---------- */
function renderList(){
  const q = ($('#searchBox').value||'').trim().toLowerCase();
  const rows = WORDS.filter(w=>!q || w.cn.toLowerCase().includes(q) || w.en.toLowerCase().includes(q));
  $('#wordList').innerHTML = rows.map(w=>{
    const b = box({kind:'word', id:w.id});
    const cls = b<0 ? 'bad' : ('b'+Math.min(3,b));
    return `<div class="wrow">
      <span class="dot ${cls}"></span>
      <span class="cn">${escapeHtml(w.cn)}${w.pos?`<span class="pill">${w.pos}</span>`:''}</span>
      <span class="en">${escapeHtml(w.en)}</span>
      <button class="speak" data-say="${escapeHtml(w.en)}">🔊</button>
    </div>`;
  }).join('') || '<p class="sub center">没找到</p>';
  document.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>speak(b.dataset.say));
}
$('#searchBox').addEventListener('input', renderList);

refreshHome();
</script>
